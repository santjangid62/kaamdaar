name: Kaamdaar CI

on:
  pull_request:
    branches: [main, feature/kaamdaar-customer-provider-admin-workflows]
  push:
    branches: [main, feature/device-bound-sessions]
  workflow_dispatch:

# Keep only the newest CI run for this branch; push and PR events share a key.
concurrency:
  group: kaamdaar-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint (changed web files)
        run: >-
          npx eslint
          src/app/api/auth/route.ts
          'src/app/api/bookings/[id]/route.ts'
          src/app/api/bookings/route.ts
          src/app/api/booking-slots/route.ts
          'src/app/services/[slug]/providers/page.tsx'
          src/components/BookingBox.tsx
          src/components/ProviderPanel.tsx
          src/app/api/providers/device-token/route.ts
          src/app/api/providers/me/route.ts
          src/app/api/providers/route.ts
          src/app/api/location/route.ts
          src/app/api/admin/login/route.ts
          'src/app/api/admin/data/[collection]/route.ts'
          src/components/admin/SectionClient.tsx
          src/server/wallet.ts
          src/server/settings.ts
          src/app/login/page.tsx
          src/lib/auth-service.ts
          src/lib/types.ts
          src/server/db.ts
          src/server/fcm.ts
          src/server/firebase-auth.ts
          src/server/device-session.ts
          src/app/api/auth/device-session/route.ts
          src/app/api/auth/device-pair/route.ts
          src/app/api/auth/device-pair/complete/route.ts
          src/lib/store.ts
          src/components/AppProvider.tsx
          src/app/api/users/resolve/route.ts
          'src/app/api/users/[id]/route.ts'
          'src/app/api/users/[id]/addresses/route.ts'
          'src/app/api/users/[id]/addresses/[addressId]/route.ts'
          src/app/api/bookings/[id]/customer-location/route.ts
          src/app/api/reviews/route.ts
          src/app/api/complaints/route.ts
          'src/app/api/wallets/[providerId]/route.ts'
          apps/provider_app/lib/core/api.dart
          apps/customer_app/lib/core/api.dart
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ""
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
          NEXT_PUBLIC_FIREBASE_APP_ID: ""
          FIREBASE_PROJECT_ID: active-valve-162810

  flutter:
    name: Flutter ${{ matrix.app }} checks and QA APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, provider_app]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Flutter's included Gradle build resolves Kotlin DSL artifacts through
      # its own settings file. Add Maven Central there as a fallback because
      # the Plugin Portal can return metadata without the Kotlin BOM artifacts.
      - name: Add Maven Central to Flutter included-build plugin resolution
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/settings.gradle.kts"
          content = path.read_text()
          if "pluginManagement {" not in content:
              plugin_repositories = """pluginManagement {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }
          }

          """
              content = plugin_repositories + content
              path.write_text(content)
          print(path.read_text())
          PY
      - name: Install packages
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos
      - name: Build Android QA debug APK
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE=https://kaamdaar-git-feat-mobile-customer-provide-bfc6c0-unique-it-team.vercel.app
          --dart-define=FIREBASE_PHONE_AUTH_TESTING=true
          --dart-define=QA_MOBILE_AUTH=true
      - name: Export QA APK signing fingerprints
        working-directory: apps/${{ matrix.app }}/android
        shell: bash
        run: |
          ./gradlew :app:signingReport | tee signing-report.txt
          awk '/Variant: debug/{show=1; next} show && /^Variant:/{exit} show && /(SHA1|SHA-1|SHA-256):/{print}' signing-report.txt > ../firebase-debug-fingerprints.txt
          echo "Debug signing fingerprints for Firebase Android app registration:"
          cat ../firebase-debug-fingerprints.txt
      - name: Upload QA APK and Firebase signing fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: kaamdaar-${{ matrix.app }}-qa-apk
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
            apps/${{ matrix.app }}/firebase-debug-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
