name: Build Kaamdaar Preview QA APKs

on:
  push:
    branches:
      - integrate/nov27-consolidated
    paths:
      - "apps/customer_app/**"
      - "apps/provider_app/**"
      - ".github/workflows/preview-qa-apks.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Successful Vercel Preview URL"
        required: false
        default: "https://kaamdaar-git-integrate-nov27-consolidated-unique-it-team.vercel.app"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }} QA APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            directory: apps/customer_app
            apk: app-customer-preview-qa.apk
          - app: provider
            directory: apps/provider_app
            apk: app-provider-preview-qa.apk

    steps:
      - name: Validate Preview API URL
        env:
          API_BASE: ${{ inputs.api_base || 'https://kaamdaar-git-integrate-nov27-consolidated-unique-it-team.vercel.app' }}
        run: |
          case "$API_BASE" in
            https://*.vercel.app) ;;
            *) echo "API_BASE must be an HTTPS Vercel Preview URL"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integrate/nov27-consolidated

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: ${{ matrix.directory }}/pubspec.lock

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.directory }}
        run: flutter analyze

      - name: Build Android QA APK against Preview API
        working-directory: ${{ matrix.directory }}
        env:
          API_BASE: ${{ inputs.api_base || 'https://kaamdaar-git-integrate-nov27-consolidated-unique-it-team.vercel.app' }}
        run: flutter build apk --debug --dart-define=API_BASE="$API_BASE"

      - name: Verify APK and record QA build target
        env:
          API_BASE: ${{ inputs.api_base || 'https://kaamdaar-git-integrate-nov27-consolidated-unique-it-team.vercel.app' }}
        run: |
          APK_PATH="${{ matrix.directory }}/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK_PATH"
          mkdir -p qa-metadata
          printf 'app=${{ matrix.app }}\\napi_base=%s\\ncommit=%s\\n' "$API_BASE" "${GITHUB_SHA}" > qa-metadata/build-info.txt
          sha256sum "$APK_PATH" > qa-metadata/apk-sha256.txt
          cp "$APK_PATH" "${{ matrix.apk }}"

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: kaamdaar-${{ matrix.app }}-preview-qa-apk
          path: ${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14
