name: Build Kaamdaar Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/customer_app/**"
      - "apps/provider_app/**"
      - ".github/workflows/android-apks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            directory: apps/customer_app
            apk: app-customer-qa-debug.apk
          - app: provider
            directory: apps/provider_app
            apk: app-provider-qa-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: ${{ matrix.directory }}/pubspec.lock

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ matrix.directory }}
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE=https://kaamdaar-git-feature-kaamdaar-customer-pr-230795-unique-it-team.vercel.app
          --dart-define=FIREBASE_PHONE_AUTH_TESTING=true
          --dart-define=QA_MOBILE_AUTH=true

      - name: Export QA APK signing fingerprints
        working-directory: ${{ matrix.directory }}/android
        shell: bash
        run: |
          ./gradlew :app:signingReport | tee signing-report.txt
          awk '/Variant: debug/{show=1; next} show && /^Variant:/{exit} show && /(SHA1|SHA-1|SHA-256):/{print}' signing-report.txt > ../firebase-debug-fingerprints.txt
          echo "Debug signing fingerprints for Firebase Android app registration:"
          cat ../firebase-debug-fingerprints.txt

      - name: Rename APK
        run: cp "${{ matrix.directory }}/build/app/outputs/flutter-apk/app-debug.apk" "${{ matrix.apk }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaamdaar-${{ matrix.app }}-qa-apk
          path: |
            ${{ matrix.apk }}
            ${{ matrix.directory }}/firebase-debug-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
